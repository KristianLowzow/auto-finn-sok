name: Skriv ut ark-URL (engangs)

on:
  workflow_dispatch: {}

jobs:
  print-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Skriv ut ark-URL og tittel
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python -c "
          from src import sheets_client
          s = sheets_client.open_sheet()
          print('TITTEL:', s.title)
          print('URL:', s.url)
          for ws in s.worksheets():
              print(f'  Fane: {ws.title!r} ({ws.row_count} rader x {ws.col_count} kolonner)')
          "
