name: Skriv ut arkets eier (engangs)

on:
  workflow_dispatch: {}

jobs:
  print-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Skriv ut hvem som eier/har tilgang til arket
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python -c "
          from src import sheets_client
          s = sheets_client.open_sheet()
          print('TITTEL:', s.title)
          for perm in s.list_permissions():
              print(f\"  rolle={perm.get('role')} type={perm.get('type')} e-post={perm.get('emailAddress', '(ingen)')} navn={perm.get('displayName', '')}\")
          "
